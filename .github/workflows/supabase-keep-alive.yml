name: Supabase keep-alive

# A free Supabase project is paused after 7 days without activity, which would
# take the backend offline until someone noticed and restored it by hand. One
# cheap RPC a day is enough to count as activity.
#
# Scheduled workflows only ever run from the repository's DEFAULT branch, which
# here is `develop`, not `main` — so this file has to be on develop to fire at
# all. Editing it on a feature branch changes nothing until it is merged.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily — off the hour, when runners queue
  workflow_dispatch:

permissions:
  actions: write           # to re-enable its own schedule, see the last step
  contents: read

env:
  SUPABASE_URL: https://gqinaapwmxkvizehseag.supabase.co
  # Publishable, and deliberately so: it only grants what row level security
  # allows, and keep_alive() is the one function granted to the anon role.
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_5S75V29tFo9TGD5Rs_nLsA_7BcxrkCk

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        run: |
          last_ping=$(curl --silent --show-error --fail-with-body \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 60 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase heartbeat: $last_ping"

      # GitHub disables scheduled workflows in a public repository after 60
      # days without a commit. Left alone that would silently stop the
      # heartbeat and the project would pause a week later.
      - name: Keep this schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keep-alive.yml/enable"
